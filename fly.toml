# fly.toml — Incenva Scraper (multi-tenant background worker)
#
# This is a pure background worker — no HTTP services.
# Each machine run scrapes all active tenants and exits (RUN_ONCE=true).
# Schedule runs via: fly machine run --schedule "0 */6 * * *"
#
# Tenant config: config/tenants.json (bundled in the image)
# Per-tenant DB URLs: fly secrets (TENANT_<ID>_DB_URL)

app = "incenva-scraper"
primary_region = "iad"

[build]

[env]
  LOG_LEVEL        = "info"
  LOG_FORMAT       = "json"
  RUN_ONCE         = "true"
  SCRAPER_VERSION  = "1.0"
  TENANTS_FILE     = "/app/config/tenants.json"
  # UNREACHABLE while RUN_ONCE is true — the process exits before the cron is
  # built, so this value is read by nothing on a one-shot machine. It is the
  # fallback for a long-lived machine (RUN_ONCE=false), and the broker's
  # "Collection interval" setting overrides it there. Left in place rather than
  # deleted so the fallback exists if the fleet ever moves to a standing
  # machine; if that never happens, delete it — a setting that reaches nothing
  # must not look like one that does.
  SCRAPER_INTERVAL = "@every 6h"

# No [[services]] block — this app has no HTTP endpoints.
# Fly will not assign a public IP or health-check port.

[deploy]
  strategy = "immediate"
